name: Wheel build

on:
  workflow_dispatch:

permissions: {}

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install lib dependencies
      # The 2.9.13* pin is unsatisfiable now that ubuntu-latest is noble (it ships
      # 2.9.14+). These host libs only serve the sdist/doc build; the wheels are all
      # built with STATIC_DEPS=true against their own downloaded libxml2/libxslt.
      run: sudo apt-get update -y -q && sudo apt-get install -y -q libxml2 libxml2-dev libxslt1.1 libxslt1-dev

    - name: Install Python dependencies
      # setuptools<70 keeps pkg_resources.parse_requirements(), which setup.py calls.
      run: python -m pip install -U pip "setuptools<70" && python -m pip install -U docutils pygments sphinx sphinx-rtd-theme -r requirements.txt

    - name: Build docs and sdist
      run: make html sdist
      env: { STATIC_DEPS: false }

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*.tar.gz

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  Linux:
    # aarch64 images run on native arm runners instead of QEMU emulation.
    runs-on: ${{ contains(matrix.image, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360

    permissions:
      contents: write

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        image:
          - manylinux1_x86_64
          - manylinux1_i686
          - manylinux_2_24_i686
          - manylinux_2_24_x86_64
          - manylinux_2_28_x86_64
          - musllinux_1_1_x86_64
          #- manylinux_2_24_ppc64le
          #- manylinux_2_24_ppc64le
          #- manylinux_2_24_s390x
        pyversion: ["*"]

        exclude:
          - image: manylinux_2_24_aarch64
            pyversion: "*"
          - image: musllinux_1_1_aarch64
            pyversion: "*"
        include:
          - image: manylinux2014_aarch64
            pyversion: "cp36*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp37*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp38*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp39*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp310*"
          - image: manylinux_2_24_aarch64
            pyversion: "cp311*"
          - image: manylinux_2_28_aarch64
            pyversion: "cp311*"
          # No cp312 leg for manylinux_2_24_aarch64: that image is archived at
          # 2022-12 and ships no /opt/python/cp312*, and upstream published no
          # cp312 manylinux_2_24 wheel either (cp312 ships as 2_28 + musllinux).
          - image: manylinux_2_28_aarch64
            pyversion: "cp312*"

          - image: musllinux_1_1_aarch64
            pyversion: "cp36*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp37*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp38*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp39*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp310*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp311*"
          - image: musllinux_1_1_aarch64
            pyversion: "cp312*"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install lib dependencies
      # The 2.9.13* pin is unsatisfiable now that ubuntu-latest is noble (it ships
      # 2.9.14+). These host libs only serve the sdist/doc build; the wheels are all
      # built with STATIC_DEPS=true against their own downloaded libxml2/libxslt.
      run: sudo apt-get update -y -q && sudo apt-get install -y -q libxml2 libxml2-dev libxslt1.1 libxslt1-dev

    - name: Install dependencies
      # setuptools<70 keeps pkg_resources.parse_requirements(), which setup.py calls.
      run: python -m pip install --force-reinstall --upgrade "setuptools<70" && python -m pip install -r requirements.txt

    - name: Build sdist
      run: make sdist
      env: { STATIC_DEPS: false }

    - name: Build Linux wheels
      run: make wheel_${{ matrix.image }}
      env: { STATIC_DEPS: true, PYTHON_BUILD_VERSION: "${{ matrix.pyversion }}" }

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: wheelhouse/*/*-m*linux*.whl  # manylinux / musllinux

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        # v4 requires unique artifact names per matrix leg, and forbids '*' in them.
        name: wheels-${{ matrix.image }}-${{ strategy.job-index }}
        path: wheelhouse/*/*-m*linux*.whl  # manylinux / musllinux
        if-no-files-found: ignore

  non-Linux:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os: [macos-latest, windows-latest]
        #os: [macos-10.15, windows-latest]
        #os: [macos-10.15]
        python-version:
          - "2.7"
          - "3.6"
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "pypy-3.8-v7.3.7"
          - "pypy-3.9-v7.3.12"
          - "pypy-3.10-v7.3.13"

        #include:
        #  - os: windows-2016
        #    python-version: 2.7
        exclude:
          - os: windows-latest
            python-version: 2.7  # needs older image
          # Upstream published no macOS cp27 wheel for this release (the released
          # cp27 wheels are manylinux_2_5 i686/x86_64 and win32/win_amd64 only),
          # so this leg cannot produce an artifact we need.  macOS 26 ships no
          # Python 2.7 and setup-python only provisions 3.*/pypy, so the leg just
          # fails in the static build.  Every other leg still runs the full suite.
          - os: macos-latest
            python-version: "2.7"

    # Python 3.6 and 3.7 cannot be provisioned on arm64 macOS (no arm64 builds
    # exist for them), so those legs run on the intel macOS image.
    runs-on: ${{ (matrix.os == 'macos-latest' && contains(fromJSON('["3.6","3.7"]'), matrix.python-version)) && 'macos-15-intel' || matrix.os }}
    timeout-minutes: 360

    permissions:
      contents: write

    env: { LIBXML2_VERSION: 2.10.3, LIBXSLT_VERSION: 1.1.39, MACOSX_DEPLOYMENT_TARGET: 11.0 }

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      if: startsWith(matrix.python-version, '3.') || startsWith(matrix.python-version, 'pypy')
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install MacOS dependencies
      if: startsWith(runner.os, 'mac')
      run: |
        brew install automake libtool
        ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize

    - name: Install dependencies
      # --force-reinstall --upgrade: the setup-python action pre-seeds a newer
      # setuptools/wheel, which would otherwise satisfy this install and leave
      # the pinned versions unused.
      # setuptools<70 is required: setup.py calls pkg_resources.parse_requirements(),
      # which newer setuptools no longer exposes ("module 'pkg_resources' has no
      # attribute 'parse_requirements'"). --force-reinstall defeats the newer
      # setuptools/wheel that setup-python pre-seeds into the toolcache.
      run: python -m pip install --force-reinstall --upgrade "setuptools<70" wheel -r requirements.txt

    - name: Build wheels
      run: make wheel
      env: { STATIC_DEPS: true, RUN_TESTS: true }

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/lxml-*.whl

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        # v4 requires unique artifact names per matrix leg.
        name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/lxml-*.whl
        if-no-files-found: ignore
